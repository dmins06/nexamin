name: Deploy to Render
on:
  push:
    branches: [ main ]

jobs:
  trigger-deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Trigger Render deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Triggering deploy for $RENDER_SERVICE_ID"
          resp=$(curl -s -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" -d '{}')
          echo "$resp"
          deploy_id=$(echo "$resp" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "Failed to create deploy. Response above."
            exit 1
          fi
          echo "Deploy created: $deploy_id"

          # Poll deploy status until success/failure or timeout
          for i in $(seq 1 60); do
            status=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" | jq -r '.status // empty')
            echo "[$i] status=$status"
            if [ "$status" = "success" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "Deploy failed"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for deploy"
          exit 1