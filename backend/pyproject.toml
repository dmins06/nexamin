[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studyhub-ai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
  "celery[redis]>=5.4,<6",
  "boto3>=1.35,<2",
  "pgvector>=0.3.6,<1",
  "structlog>=24.4,<26",
  "slowapi>=0.1.9,<1",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "aiosqlite>=0.20,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP042", "UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
